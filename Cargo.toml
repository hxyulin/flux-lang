[workspace]
resolver = "3"
members = [
    "crates/flux-arena",
    "crates/flux-intern",
    "crates/flux-syntax",
    "crates/flux-sourcegen",
    "crates/flux-hir",
    "crates/flux-proc-macro",
    "crates/flux-ty-ir",
    "crates/flux-solve",
    "crates/flux-ty",
    "crates/flux-mir",
    "crates/flux-codegen",
    "crates/flux-cli",
    "crates/flux-difftest",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hxyulin/flux-lang"

[workspace.dependencies]
flux-arena = { path = "crates/flux-arena" }
flux-intern = { path = "crates/flux-intern" }
flux-syntax = { path = "crates/flux-syntax" }
flux-hir = { path = "crates/flux-hir" }
flux-proc-macro = { path = "crates/flux-proc-macro" }
flux-ty-ir = { path = "crates/flux-ty-ir" }
flux-solve = { path = "crates/flux-solve" }
flux-ty = { path = "crates/flux-ty" }
flux-mir = { path = "crates/flux-mir" }
flux-codegen = { path = "crates/flux-codegen" }

# keel, pinned to a commit on its main branch. To build against a local
# checkout, add a `[patch."https://github.com/hxyulin/keel"]` section to
# `.cargo/config.toml` (git-ignored); see CONTRIBUTING.md.
keel-asm = { git = "https://github.com/hxyulin/keel", rev = "e4c72445116afcc826c1020e28befca3a5fc6645" }
keel-codegen = { git = "https://github.com/hxyulin/keel", rev = "e4c72445116afcc826c1020e28befca3a5fc6645" }
keel-frontend = { git = "https://github.com/hxyulin/keel", rev = "e4c72445116afcc826c1020e28befca3a5fc6645" }
keel-ir = { git = "https://github.com/hxyulin/keel", rev = "e4c72445116afcc826c1020e28befca3a5fc6645" }
keel-link = { git = "https://github.com/hxyulin/keel", rev = "e4c72445116afcc826c1020e28befca3a5fc6645" }
keel-opt = { git = "https://github.com/hxyulin/keel", rev = "e4c72445116afcc826c1020e28befca3a5fc6645" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
undocumented_unsafe_blocks = "deny"

# Speed up compiler-heavy tests without disabling development-time checks.
[profile.test]
opt-level = 1
debug-assertions = true
overflow-checks = true
