[workspace]
resolver = "3"
members = [
    "crates/flux-arena",
    "crates/flux-intern",
    "crates/flux-syntax",
    "crates/flux-sourcegen",
    "crates/flux-hir",
    "crates/flux-ty",
    "crates/flux-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hxyulin/flux-lang"

[workspace.dependencies]
flux-arena = { path = "crates/flux-arena" }
flux-intern = { path = "crates/flux-intern" }
flux-syntax = { path = "crates/flux-syntax" }
flux-hir = { path = "crates/flux-hir" }
flux-ty = { path = "crates/flux-ty" }

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
