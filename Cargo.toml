[workspace]
resolver = "3"
members = [
    "crates/flux-arena",
    "crates/flux-intern",
    "crates/flux-syntax",
    "crates/flux-sourcegen",
    "crates/flux-hir",
    "crates/flux-ty",
    "crates/flux-mir",
    "crates/flux-codegen",
    "crates/flux-cli",
    "crates/flux-difftest",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hxyulin/flux-lang"

[workspace.dependencies]
flux-arena = { path = "crates/flux-arena" }
flux-intern = { path = "crates/flux-intern" }
flux-syntax = { path = "crates/flux-syntax" }
flux-hir = { path = "crates/flux-hir" }
flux-ty = { path = "crates/flux-ty" }
flux-mir = { path = "crates/flux-mir" }
flux-codegen = { path = "crates/flux-codegen" }

# keel, pinned to a commit on its main branch. To build against a local
# checkout, add a `[patch."https://github.com/hxyulin/keel"]` section to
# `.cargo/config.toml` (git-ignored); see CONTRIBUTING.md.
keel-asm = { git = "https://github.com/hxyulin/keel", rev = "1aa8c53686892e4e3c09aa0c512c03da02148f92" }
keel-codegen = { git = "https://github.com/hxyulin/keel", rev = "1aa8c53686892e4e3c09aa0c512c03da02148f92" }
keel-frontend = { git = "https://github.com/hxyulin/keel", rev = "1aa8c53686892e4e3c09aa0c512c03da02148f92" }
keel-ir = { git = "https://github.com/hxyulin/keel", rev = "1aa8c53686892e4e3c09aa0c512c03da02148f92" }
keel-link = { git = "https://github.com/hxyulin/keel", rev = "1aa8c53686892e4e3c09aa0c512c03da02148f92" }
keel-opt = { git = "https://github.com/hxyulin/keel", rev = "1aa8c53686892e4e3c09aa0c512c03da02148f92" }

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
