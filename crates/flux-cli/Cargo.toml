[package]
name = "flux-cli"
description = "Command-line driver for the flux compiler"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
publish = false

[[bin]]
name = "flux"
path = "src/main.rs"

[dependencies]
flux-codegen.workspace = true
flux-hir.workspace = true
flux-intern.workspace = true
flux-mir.workspace = true
flux-syntax.workspace = true
flux-ty.workspace = true
clap = { version = "4", features = ["derive"] }

[lints]
workspace = true
